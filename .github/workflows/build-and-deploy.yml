name: Build firmware and deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ESP32-C3 Super Mini
        run: pio run -e c3-supermini

      - name: Build ESP32-S3 DevKit
        run: pio run -e s3-devkit

      - name: Build ESP32 WROOM
        run: pio run -e esp32-wroom

      - name: Verify web firmware files
        run: |
          test -s site/firmware/c3-supermini/firmware.bin
          test -s site/firmware/s3-devkit/firmware.bin
          test -s site/firmware/esp32-wroom/firmware.bin
          ls -lh site/firmware/*/firmware.bin

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
